<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Héritage - 100 Défis Minecraft</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-frame-outer: #281c13;
            --mc-frame-inner: #5c4033;
            --mc-slot-bg: #8b8b8b;
            --mc-slot-border-light: #ffffff;
            --mc-slot-border-dark: #373737;
            --glow-green: #55ff55;
            --glow-gold: #ffff55;
            --wire-off: #4a0000;
            --wire-on: #ff2200;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'VT323', monospace;
            user-select: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- CADRE & FOND --- */
        #game-frame {
            width: 98vw; height: 96vh;
            background-color: var(--mc-frame-inner);
            border: 8px solid var(--mc-frame-outer);
            position: relative;
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }

        #top-bar {
            height: 85px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 4px solid #111;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .xp-title { font-size: 20px; color: #ccc; margin-bottom: 5px; text-shadow: 2px 2px #000; }
        
        .xp-container {
            width: 600px; height: 16px;
            background: #222; border: 2px solid #000;
            border-top-color: #555; border-left-color: #555;
            position: relative;
        }
        .xp-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #10C910, #8AF78A);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px #10C910;
        }

        .stats { font-size: 22px; color: var(--glow-gold); margin-top: 6px; text-shadow: 2px 2px #000; letter-spacing: 1px;}

        #viewport {
            flex-grow: 1; position: relative; overflow: hidden; cursor: grab;
            background-color: #3a2618;
            background-image: 
                linear-gradient(45deg, #332012 25%, transparent 25%, transparent 75%, #332012 75%, #332012),
                linear-gradient(45deg, #332012 25%, transparent 25%, transparent 75%, #332012 75%, #332012);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }
        #viewport:active { cursor: grabbing; }

        #map-container {
            position: absolute; transform-origin: 0 0;
            width: 8000px; height: 8000px;
            will-change: transform;
        }

        /* --- REDSTONE (SVG) --- */
        #svg-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none; z-index: 1;
        }
        .wire { stroke: var(--wire-off); stroke-width: 8; fill: none; stroke-linejoin: miter; transition: stroke 0.3s; }
        .wire.active { stroke: var(--wire-on); filter: drop-shadow(0 0 6px #ff0000); }

        /* --- NODES (Slots Minecraft) --- */
        #nodes-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        .node-wrapper {
            position: absolute; display: flex; align-items: center;
            transform: translate(-50%, -50%);
        }

        .node-slot {
            width: 60px; height: 60px;
            background: var(--mc-slot-bg);
            border: 4px solid;
            border-color: var(--mc-slot-border-light) var(--mc-slot-border-dark) var(--mc-slot-border-dark) var(--mc-slot-border-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; cursor: pointer; position: relative;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.15s, border-color 0.3s;
        }
        .node-slot:hover { transform: scale(1.15); z-index: 10; }

        .icon { position: relative; z-index: 2; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); }

        /* États */
        .node-slot.locked { filter: grayscale(100%) brightness(0.5); cursor: not-allowed; }
        .node-slot.locked:hover { transform: scale(1); }
        
        .node-slot.completed {
            background: #2a2a2a;
            border-color: var(--glow-green);
            box-shadow: 0 0 20px var(--glow-green), inset 0 0 15px var(--glow-green);
        }
        
        .checkmark {
            position: absolute; bottom: -12px; right: -12px;
            color: var(--glow-green); font-size: 30px; text-shadow: 2px 2px #000;
            display: none; z-index: 5; font-weight: bold;
        }
        .node-slot.completed .checkmark { display: block; }

        .node-slot.epic { width: 84px; height: 84px; font-size: 50px; border-color: #aa00aa; border-top-color: #ff55ff; border-left-color: #ff55ff;}
        .node-slot.epic.completed { border-color: var(--glow-gold); box-shadow: 0 0 40px var(--glow-gold), inset 0 0 20px var(--glow-gold); }
        .node-slot.epic .checkmark { font-size: 40px; bottom: -15px; right: -15px; color: var(--glow-gold); }

        .node-title-label {
            position: absolute; top: 110%; left: 50%; transform: translateX(-50%);
            white-space: nowrap; font-size: 20px; color: #fff; text-shadow: 2px 2px #000;
            text-align: center; pointer-events: none;
        }
        .locked .node-title-label { color: #666; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.3s; border-color: red !important; }

        /* --- TOOLTIP ENRICHI --- */
        #tooltip {
            position: fixed; background: rgba(20, 5, 20, 0.95);
            border: 2px solid #5a1a5a; padding: 15px;
            width: 320px; pointer-events: none; opacity: 0; z-index: 1000;
            transition: opacity 0.1s; box-shadow: 5px 5px 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(90,26,90,0.3);
        }
        .tt-status { font-size: 18px; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        .tt-status.lock { color: #ff5555; }
        .tt-status.ready { color: #55ffff; }
        .tt-status.done { color: var(--glow-green); }
        .tt-title { color: var(--glow-gold); font-size: 26px; margin-bottom: 5px; text-shadow: 2px 2px #000; line-height: 1.1;}
        .tt-desc { color: #aaaaaa; font-size: 18px; line-height: 1.2; margin-bottom: 10px;}
        .tt-sep { height: 1px; background: #5a1a5a; margin: 10px 0; }
        .tt-details { color: #e0e0e0; font-size: 17px; line-height: 1.3; }

        /* --- PARTICULES --- */
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

        /* Contrôles */
        .controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        .btn {
            background: #8b8b8b; border: 3px solid; border-color: #fff #373737 #373737 #fff;
            color: black; font-family: 'VT323'; font-size: 28px;
            width: 45px; height: 45px; cursor: pointer; box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .btn:active { border-color: #373737 #fff #fff #373737; transform: translateY(2px); }

    </style>
</head>

            {id: 95, p: 94, x: 25, y: 27, e: false, icon: "😭", t: "Larmes de Ghast", d: "Ferme à Ghasts.", dt: "Au-dessus du plafond du Nether, créez une usine spécialisée dans l'apparition et l'abattage de Ghasts." },
            {id: 96, p: 95, x: 28, y: 27, e: false, icon: "🌋", t: "Mines Opti Nether", d: "Quartz à l'infini.", dt: "Mine optimisée à la TNT dans le Nether pour récolter des milliers de blocs de Quartz." },
            // Ajouts Magie/Aventure
            {id: 97, p: 64, x: 28, y: 3, e: false, icon: "🧊", t: "Ferme à Glace", d: "Glace bleue.", dt: "Ferme AFK dans un biome neige pour générer la glace de vos autoroutes." },
            {id: 98, p: 97, x: 31, y: 3, e: false, icon: "🎯", t: "Stand de Tir", d: "Mini-jeu redstone.", dt: "Construisez un mini-jeu avec cibles, lampes redstone et compteur de score automatique." },
            {id: 99, p: 98, x: 34, y: 3, e: false, icon: "📖", t: "Le Livre d'Histoire", d: "Héritage.", dt: "Écrivez le récit de votre serveur dans un livre et plume, et scellez-le dans le coffre-fort de la ville." }
        ];

        // --- VARIABLES GLOBALES ---
        const mapContainer = document.getElementById('map-container');
        const nodesLayer = document.getElementById('nodes-layer');
        const svgLayer = document.getElementById('svg-layer');
        const tooltip = document.getElementById('tooltip');
        let savedProgress = JSON.parse(localStorage.getItem('mc_100_v2')) || {};

        if(!savedProgress[0]) savedProgress[0] = true; // Racine système

        const GRID_X = 160; 
        const GRID_Y = 120;

        // --- INITIALISATION ---
        function initMap() {
            // Créer les slots HTML
            rawMissions.forEach(m => {
                const px = m.x * GRID_X;
                const py = m.y * GRID_Y;

                const wrapper = document.createElement('div');
                wrapper.className = 'node-wrapper';
                wrapper.style.left = `${px}px`;
                wrapper.style.top = `${py}px`;

                // Spécial pour le boss final
                if(m.id === 100) {
                    wrapper.style.transform = "translate(-50%, -50%) scale(1.3)";
                }

                wrapper.innerHTML = `
                    <div class="node-slot" id="slot-${m.id}" onclick="handleNodeClick(${m.id}, event)">
                        <span class="icon">${m.icon}</span>
                        <div class="checkmark">✔</div>
                        <div class="node-title-label">${m.e ? m.t : ''}</div>
                    </div>
                `;

                // Tooltip events
                const slotEl = wrapper.querySelector('.node-slot');
                slotEl.addEventListener('mouseenter', (e) => showTooltip(e, m));
                slotEl.addEventListener('mouseleave', hideTooltip);

                nodesLayer.appendChild(wrapper);
            });

            // Créer les lignes SVG
            let svgHTML = '';
            rawMissions.forEach(m => {
                if (m.p !== 0) {
                    const parent = rawMissions.find(x => x.id === m.p);
                    if (parent) {
                        const sx = parent.x * GRID_X;
                        const sy = parent.y * GRID_Y;
                        const ex = m.x * GRID_X;
                        const ey = m.y * GRID_Y;
                        // Tracé en angle droit
                        const path = `M ${sx} ${sy} L ${ex} ${sy} L ${ex} ${ey}`;
                        svgHTML += `<path id="wire-${m.p}-${m.id}" class="wire" d="${path}" />`;
                    }
                }
            });
            svgLayer.innerHTML = svgHTML;

            updateVisuals();
            updateHUD();
        }

        // --- MOTEUR DE MISE A JOUR (Réécrit et Robuste) ---
        function updateVisuals() {
            rawMissions.forEach(m => {
                const id = m.id;
                const pId = m.p;
                const slot = document.getElementById(`slot-${id}`);
                const wire = document.getElementById(`wire-${pId}-${id}`);
                
                const isParentDone = pId === 0 || !!savedProgress[pId];
                const isDone = !!savedProgress[id];

                // 1. Mise à jour du noeud
                if (!isParentDone) {
                    slot.className = `node-slot locked ${m.e ? 'epic' : ''}`;
                } else {
                    slot.className = `node-slot ${m.e ? 'epic' : ''} ${isDone ? 'completed' : ''}`;
                }

                // 2. Mise à jour propre de la Redstone
                if (wire) {
                    if (isParentDone && isDone) {
                        wire.classList.add('active');
                    } else {
                        wire.classList.remove('active');
                    }
                }
            });
        }

        function handleNodeClick(id, event) {
            const mission = rawMissions.find(m => m.id === id);
            const isParentDone = mission.p === 0 || !!savedProgress[mission.p];

            // Animation de refus si bloqué
            if (!isParentDone) {
                const el = document.getElementById(`slot-${id}`);
                el.classList.add('shaking');
                setTimeout(() => el.classList.remove('shaking'), 300);
                return; 
            }

            // Bascule
            savedProgress[id] = !savedProgress[id];
            
            if (savedProgress[id]) {
                spawnParticles(event.clientX, event.clientY);
            } else {
                lockChildrenCascade(id);
            }

            localStorage.setItem('mc_100_v2', JSON.stringify(savedProgress));
            
            updateVisuals();
            updateHUD();
            showTooltip(event, mission); // Rafraichir le texte du tooltip
        }

        function lockChildrenCascade(parentId) {
            rawMissions.forEach(m => {
                if(m.p === parentId && savedProgress[m.id]) {
                    savedProgress[m.id] = false;
                    lockChildrenCascade(m.id);
                }
            });
        }

        function updateHUD() {
            const count = Object.keys(savedProgress).filter(k => k !== "0" && savedProgress[k]).length;
            document.getElementById('xpBar').style.width = `${count}%`;
            document.getElementById('statsText').innerText = `DÉFIS COMPLÉTÉS: ${count} / 100 (NIVEAU ${count})`;
        }

        // --- TOOLTIP ---
        function showTooltip(e, m) {
            const isParentDone = m.p === 0 || !!savedProgress[m.p];
            const isDone = !!savedProgress[m.id];
            
            const st = document.getElementById('tt-status');
            if (!isParentDone) {
                st.innerText = "🔒 VERROUILLÉ (Complétez la mission d'avant)";
                st.className = "tt-status lock";
            } else if (isDone) {
                st.innerText = "✔ MISSION ACCOMPLIE";
                st.className = "tt-status done";
            } else {
                st.innerText = "⭐ DÉFI DISPONIBLE";
                st.className = "tt-status ready";
            }

            document.getElementById('tt-title').innerText = m.t;
            document.getElementById('tt-desc').innerText = m.d;
            document.getElementById('tt-details').innerText = m.dt;

            tooltip.style.opacity = '1';
            
            const moveTooltip = (ev) => {
                // Ajuster si on sort de l'écran à droite ou en bas
                let x = ev.clientX + 20;
                let y = ev.clientY + 20;
                if(x + 320 > window.innerWidth) x = ev.clientX - 340;
                if(y + 200 > window.innerHeight) y = ev.clientY - 220;
                
                tooltip.style.left = `${x}px`;
                tooltip.style.top = `${y}px`;
            };
            moveTooltip(e);
            window.addEventListener('mousemove', moveTooltip);
            tooltip.moveFn = moveTooltip; 
        }

        function hideTooltip() {
            tooltip.style.opacity = '0';
            if (tooltip.moveFn) window.removeEventListener('mousemove', tooltip.moveFn);
        }

        // --- PARTICULES ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = document.getElementById('map-container').clientWidth;
            canvas.height = document.getElementById('map-container').clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function spawnParticles(screenX, screenY) {
            const rect = container.getBoundingClientRect();
            const mapX = (screenX - rect.left) / currentScale;
            const mapY = (screenY - rect.top) / currentScale;

            for(let i=0; i<40; i++) {
                particles.push({
                    x: mapX, y: mapY,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16 - 6,
                    life: 1,
                    color: Math.random() > 0.5 ? '#80ff20' : '#ffff55'
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.5;
                p.life -= 0.02;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, 8, 8);
                }
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateParticles);
        }

        // --- CAMÉRA ---
        const viewport = document.getElementById('viewport');
        const container = document.getElementById('map-container');
        let isDragging = false, startX, startY, transX = 0, transY = 0, currentScale = 1;

        viewport.addEventListener('mousedown', (e) => {
            if(e.target.closest('.node-slot') || e.target.closest('.btn')) return; 
            isDragging = true;
            startX = e.clientX - transX;
            startY = e.clientY - transY;
            document.body.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            transX = e.clientX - startX;
            transY = e.clientY - startY;
            applyTransform();
            hideTooltip();
        });

        window.addEventListener('mouseup', () => { isDragging = false; document.body.style.cursor = 'default'; });
        window.addEventListener('mouseleave', () => { isDragging = false; hideTooltip(); document.body.style.cursor = 'default'; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomMap(e.deltaY * -0.001);
        }, { passive: false });

        function zoomMap(delta) {
            currentScale += delta;
            currentScale = Math.min(Math.max(0.3, currentScale), 2.5);
            applyTransform();
        }

        function centerMap() {
            const targetX = 10 * GRID_X;
            const targetY = 15 * GRID_Y;
            transX = (viewport.clientWidth / 2) - (targetX * currentScale);
            transY = (viewport.clientHeight / 2) - (targetY * currentScale);
            applyTransform();
        }

        function applyTransform() {
            container.style.transform = `translate(${transX}px, ${transY}px) scale(${currentScale})`;
        }

        // --- DÉMARRAGE ---
        initMap();
        resizeCanvas();
        animateParticles();
        setTimeout(centerMap, 50);

    </script>
